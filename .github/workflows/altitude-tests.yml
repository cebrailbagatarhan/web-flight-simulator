name: Altitude display tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  altitude:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check src/ui/hud.js
